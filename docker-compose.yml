version: '3.8'
services:
  api:
    build: .
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    command: bash -c "bundle check || bundle install && bin/rails db:prepare && rm -f tmp/pids/server.pid && bin/rails s -p 3000 -b '0.0.0.0'"
    tty: true
    stdin_open: true

  frontend:
    image: node:20
    volumes:
      - ./frontend:/app
    working_dir: /app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"